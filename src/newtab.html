<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="newTabTitle">New Tab</title>
    <link rel="stylesheet" href="newtab.css">
  </head>
  <body>
    <main class="ntp-main">
      <ul id="ntp-tiles" class="ntp-tiles"></ul>

      <section
        id="ntp-recent"
        class="ntp-recent"
        data-i18n-aria="recentCardsLabel"
        aria-label="Recently closed tabs"
      >
        <!-- The base of the stack: the detailed list, one step below the
             oldest card and always in front of nothing. Rebuilt with the
             cards by renderRecentCards(). -->
        <section
          id="ntp-session-list"
          class="ntp-session-list"
          data-i18n-aria="sessionListLabel"
          aria-label="Recently closed sessions"
        ></section>
      </section>

    </main>

    <button
      id="ntp-settings-button"
      class="ntp-settings-button"
      type="button"
      data-i18n-aria="settingsButton"
      aria-label="Settings"
    >
      <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <path d="M18.2838 43.1713C14.9327 42.1736 11.9498 40.3213 9.58787 37.867C10.469 36.8227 11 35.4734 11 34.0001C11 30.6864 8.31371 28.0001 5 28.0001C4.79955 28.0001 4.60139 28.01 4.40599 28.0292C4.13979 26.7277 4 25.3803 4 24.0001C4 21.9095 4.32077 19.8938 4.91579 17.9995C4.94381 17.9999 4.97188 18.0001 5 18.0001C8.31371 18.0001 11 15.3138 11 12.0001C11 11.0488 10.7786 10.1493 10.3846 9.35011C12.6975 7.1995 15.5205 5.59002 18.6521 4.72314C19.6444 6.66819 21.6667 8.00013 24 8.00013C26.3333 8.00013 28.3556 6.66819 29.3479 4.72314C32.4795 5.59002 35.3025 7.1995 37.6154 9.35011C37.2214 10.1493 37 11.0488 37 12.0001C37 15.3138 39.6863 18.0001 43 18.0001C43.0281 18.0001 43.0562 17.9999 43.0842 17.9995C43.6792 19.8938 44 21.9095 44 24.0001C44 25.3803 43.8602 26.7277 43.594 28.0292C43.3986 28.01 43.2005 28.0001 43 28.0001C39.6863 28.0001 37 30.6864 37 34.0001C37 35.4734 37.531 36.8227 38.4121 37.867C36.0502 40.3213 33.0673 42.1736 29.7162 43.1713C28.9428 40.752 26.676 39.0001 24 39.0001C21.324 39.0001 19.0572 40.752 18.2838 43.1713Z" />
        <path d="M24 31C27.866 31 31 27.866 31 24C31 20.134 27.866 17 24 17C20.134 17 17 20.134 17 24C17 27.866 20.134 31 24 31Z" />
      </svg>
    </button>

    <dialog id="ntp-settings" class="ntp-settings">
      <header class="ntp-settings-header">
        <h2 data-i18n="settingsTitle">Settings</h2>
        <button
          class="ntp-settings-close"
          type="button"
          data-close-settings
          data-i18n-aria="closeSettings"
          aria-label="Close"
        >
          ×
        </button>
      </header>
      <label class="ntp-settings-option">
        <input id="opt-domain-only" type="checkbox">
        <span data-i18n="optionDomainOnly">Domain only</span>
      </label>
      <label class="ntp-settings-option">
        <input id="opt-exclude-bookmarks" type="checkbox">
        <span data-i18n="optionExcludeBookmarks">Exclude bookmarked sites</span>
      </label>
      <label class="ntp-settings-option">
        <input id="opt-firefox-style" type="checkbox">
        <span data-i18n="optionFirefoxStyle">Use Firefox-style tiles</span>
      </label>
      <label class="ntp-settings-option">
        <span data-i18n="optionSnapshotCap">Snapshot size</span>
        <select id="opt-snapshot-cap" class="ntp-settings-select">
          <option value="720">720P</option>
          <option value="1080">1080P</option>
          <option value="1440">2K</option>
          <option value="2160">4K</option>
        </select>
      </label>
      <label class="ntp-settings-option">
        <span data-i18n="optionRecentCount">Recently closed cards</span>
        <select id="opt-recent-count" class="ntp-settings-select">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </label>
      <label class="ntp-settings-option">
        <input id="opt-exclude-privileged" type="checkbox">
        <span data-i18n="optionExcludePrivileged">Exclude privileged pages</span>
      </label>
      <label class="ntp-settings-option">
        <input id="opt-exclude-windows" type="checkbox">
        <span data-i18n="optionExcludeWindows">Exclude windows</span>
      </label>
      <!-- Debug helper: not persisted, resets to off on every load. -->
      <label class="ntp-settings-option">
        <input id="opt-letter-favicons" type="checkbox">
        <span data-i18n="optionLetterFavicons">Debug: letter icons only</span>
      </label>
    </dialog>

    <!-- IconPark "copy" (Apache-2.0), recolored to currentColor. -->
    <template id="ntp-card-copy-icon">
      <svg class="ntp-card-copy-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <path d="M13 12.4316V7.8125C13 6.2592 14.2592 5 15.8125 5H40.1875C41.7408 5 43 6.2592 43 7.8125V32.1875C43 33.7408 41.7408 35 40.1875 35H35.5163" />
        <path d="M32.1875 13H7.8125C6.2592 13 5 14.2592 5 15.8125V40.1875C5 41.7408 6.2592 43 7.8125 43H32.1875C33.7408 43 35 41.7408 35 40.1875V15.8125C35 14.2592 33.7408 13 32.1875 13Z" />
      </svg>
    </template>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
